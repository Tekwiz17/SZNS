name: Build SZNS
concurrency:
  group: szns-build-${{ github.ref }}
  cancel-in-progress: true
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 18
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Check settings, patterns and Dock geometry
        run: |
          swiftc SZNS/Scene.swift SZNS/DisplayGeometry.swift Tests/main.swift -o "$RUNNER_TEMP/scene-checks"
          "$RUNNER_TEMP/scene-checks"
      - name: Render celebration effects and bulb artwork
        run: |
          swiftc -target "$(uname -m)-apple-macos14.0" -parse-as-library SZNS/{Scene,Studio,LightDrawing,WeatherDrawing}.swift Tests/RenderChecks.swift -o "$RUNNER_TEMP/render-checks"
          "$RUNNER_TEMP/render-checks"
      - name: Build the Xcode Run configuration
        run: |
          xcodebuild -quiet -project SZNS.xcodeproj -scheme SZNS -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/SZNSBuild" build
      - name: Build the shared Xcode scheme
        run: |
          set -o pipefail
          xcodebuild -project SZNS.xcodeproj -scheme SZNS -configuration Release ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO -destination 'generic/platform=macOS' -derivedDataPath "$RUNNER_TEMP/SZNSBuild" build
      - name: Verify the app and Shortcuts metadata
        id: package
        run: |
          app="$RUNNER_TEMP/SZNSBuild/Build/Products/Release/SZNS.app"
          codesign --verify --strict "$app"
          lipo "$app/Contents/MacOS/SZNS" -verify_arch arm64 x86_64
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          test -s "$app/Contents/Resources/AppIcon.icns"
          python3 - "$app/Contents/Resources/Metadata.appintents/extract.actionsdata" <<'PYTHON'
          import json, sys
          with open(sys.argv[1]) as metadata:
              actions = json.load(metadata)["actions"]
          expected = {"SetDecorationIntent", "ApplySceneIntent", "SetLightPatternIntent",
                      "SetWeatherIntent", "SetStrandValueIntent", "SetStrandStyleIntent"}
          missing = expected.difference(actions)
          if missing:
              raise SystemExit(f"Missing Shortcuts actions: {sorted(missing)}")
          print(f"Verified {len(expected)} SZNS actions")
          PYTHON
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/SZNS-macOS.zip"
      - name: Smoke-test app launch
        timeout-minutes: 2
        run: |
          app="$RUNNER_TEMP/SZNSBuild/Build/Products/Release/SZNS.app"
          "$app/Contents/MacOS/SZNS" > "$RUNNER_TEMP/SZNS-launch.log" 2>&1 &
          pid=$!
          sleep 6
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$RUNNER_TEMP/SZNS-launch.log"
            exit 1
          fi
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          SZNS_TEST_PID="$pid" swift - <<'SWIFT'
          import AppKit
          let pid = Int(ProcessInfo.processInfo.environment["SZNS_TEST_PID"]!)!
          let windows = CGWindowListCopyWindowInfo(.optionOnScreenOnly, kCGNullWindowID) as? [[String: Any]] ?? []
          let hasSettingsWindow = windows.contains { window in
              guard window[kCGWindowOwnerPID as String] as? Int == pid,
                    window[kCGWindowLayer as String] as? Int == 0,
                    let bounds = window[kCGWindowBounds as String] as? NSDictionary,
                    let rect = CGRect(dictionaryRepresentation: bounds as CFDictionary) else { return false }
              return rect.width >= 500 && rect.height >= 400
          }
          guard hasSettingsWindow else { fatalError("SZNS started without a visible settings window") }
          print("First launch displayed the native settings window")
          SWIFT
      - name: Check the running app against the system Dock
        timeout-minutes: 4
        run: |
          swiftc Tests/LiveDockCheck.swift -o "$RUNNER_TEMP/dock-check"
          defaults write com.apple.dock autohide -bool false
          defaults write com.apple.dock tilesize -int 48
          app="$RUNNER_TEMP/SZNSBuild/Build/Products/Release/SZNS.app"
          "$app/Contents/MacOS/SZNS" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for side in bottom left right; do
            defaults write com.apple.dock orientation -string "$side"
            killall Dock
            sleep 3
            if [ "$side" = bottom ]; then
              "$RUNNER_TEMP/dock-check" "$pid" bottom "$RUNNER_TEMP/initial-width"
              defaults write com.apple.dock tilesize -int 24
              killall Dock
              sleep 3
              "$RUNNER_TEMP/dock-check" "$pid" bottom "$RUNNER_TEMP/initial-width"
              defaults write com.apple.dock tilesize -int 48
            else
              "$RUNNER_TEMP/dock-check" "$pid" "$side"
            fi
          done
          defaults write com.apple.dock autohide -bool true
          killall Dock
          sleep 3
          "$RUNNER_TEMP/dock-check" "$pid" hidden
          "$RUNNER_TEMP/dock-check" "$pid" reveal
          "$RUNNER_TEMP/dock-check" "$pid" hidden
      - name: Verify timed pause across a real app launch
        timeout-minutes: 2
        run: |
          app="$RUNNER_TEMP/SZNSBuild/Build/Products/Release/SZNS.app"
          prefs="$HOME/Library/Application Support/SZNS/Preferences.json"
          swiftc Tests/LivePauseCheck.swift -o "$RUNNER_TEMP/pause-check"
          swiftc -parse-as-library SZNS/Scene.swift Tests/SeedPausedScene.swift -o "$RUNNER_TEMP/seed-pause"
          "$RUNNER_TEMP/seed-pause" "$prefs"
          "$app/Contents/MacOS/SZNS" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          "$RUNNER_TEMP/pause-check" "$pid"
      - uses: actions/upload-artifact@v4
        with:
          name: SZNS-macOS
          path: ${{ runner.temp }}/SZNS-macOS.zip


  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    concurrency: szns-release
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SZNS-macOS
          path: packaged
      - name: Publish the verified app
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+([.][0-9]+){1,2}$ ]]
          notes="releases/$VERSION.md"
          note_args=(--generate-notes)
          if [[ -f "$notes" ]]; then note_args=(--notes-file "$notes"); fi
          tag="v$VERSION"
          asset="packaged/SZNS-macOS.zip"
          unzip -tq "$asset"
          if gh release view "$tag" --json isDraft,assets > "$RUNNER_TEMP/release.json"; then
            if jq -e '.isDraft == false and any(.assets[]; .name == "SZNS-macOS.zip" and .size > 0)' "$RUNNER_TEMP/release.json"; then
              echo "$tag already has a published app."
              exit 0
            fi
            echo "An incomplete release already exists for $tag." >&2
            exit 1
          fi
          gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "SZNS $VERSION" "${note_args[@]}"
          gh release download "$tag" --pattern SZNS-macOS.zip --dir "$RUNNER_TEMP/released"
          cmp "$asset" "$RUNNER_TEMP/released/SZNS-macOS.zip"
